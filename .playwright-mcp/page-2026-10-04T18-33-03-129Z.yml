          - paragraph [ref=f2e118]: Last step before it's ready to go out. The system already knows which country it's headed to — 16 destinations, each with its own flag, split between Europe and Export.
        - generic [ref=f2e120]:
          - generic [ref=f2e121]: 80412917 · 6 picks
          - heading "Pick up next day / Pick up today" [level=3] [ref=f2e122]
          - paragraph [ref=f2e123]: Priority deliveries stand out on their own. The whole board can be filtered between Europe and Export — something impossible to do by eye on a physical board with 20 cards.
