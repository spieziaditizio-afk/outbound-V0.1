  - generic [ref=f2e132]:
    - generic [ref=f2e133]:
      - generic [ref=f2e134]: 03 — Beyond replicating the whiteboard
      - heading "Six things the physical board could never do" [level=2] [ref=f2e135]
      - paragraph [ref=f2e136]: It's not just digitizing the card — the system solves problems that today aren't even attempted.
    - generic [ref=f2e138]:
      - generic [ref=f2e139]:
        - heading "Marker allocation engine" [level=4] [ref=f2e143]
        - paragraph [ref=f2e144]: Plain cone first, then cone + disc/hex, a disc or hex alone, or two toppers stacked in different colors (disc + disc, hex + hex, disc + hex) for 1–6 picks; always a single color and shape from 7 picks up — the same rule applied by hand today, now calculated on its own.
      - generic [ref=f2e145]:
        - heading "16 destinations, Europe vs. Export" [level=4] [ref=f2e148]
        - paragraph [ref=f2e149]: USA, Vietnam, Mexico, Taiwan, China, Thailand, Israel, Germany, the Netherlands, Czech Republic, Hungary (Üllő and Komárom), Singapore, South Korea, the Philippines, Malaysia — each with its own flag and filterable in one click.
      - generic [ref=f2e150]:
        - heading "Time-in-status alerts" [level=4] [ref=f2e154]
        - paragraph [ref=f2e155]: Every card carries a bar that warns when it's spent longer than expected in a status — the team leader no longer depends on looking at the board at the right moment.
      - generic [ref=f2e156]:
        - heading "Full activity history" [level=4] [ref=f2e159]
        - paragraph [ref=f2e160]: Every status change is logged with who did it and at what time, forever — something a magnetic card can never keep.
      - generic [ref=f2e161]:
        - heading "Live sync + TV mode" [level=4] [ref=f2e165]
        - paragraph [ref=f2e166]: Several open screens update each other automatically, and the wall view (TV mode) shows the full board with no controls, for the team leader's constant observation.
      - generic [ref=f2e167]:
        - heading "Live cone stock" [level=4] [ref=f2e170]
        - paragraph [ref=f2e171]: How many cones, discs and hexes are free and in use in each color, at every moment — no counting by hand on the rack.
  - generic [ref=f2e174]:
    - generic [ref=f2e175]: 04 — Real-time status
    - heading "Statuses that update on their own, every minute" [level=2] [ref=f2e176]
    - paragraph [ref=f2e177]: Today someone has to move each card by hand. The board can also read a small CSV file exported by the warehouse system (WMS) every minute and move the deliveries automatically — so what you see on screen is what the system already knows.
