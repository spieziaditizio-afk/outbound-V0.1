  - generic [ref=f2e20]:
    - generic [ref=f2e21]: 01 — How it works today
    - heading "One magnetic card per delivery, moved by hand through every status" [level=2] [ref=f2e22]
    - paragraph [ref=f2e23]: This is the process right now, before touching a single screen.
    - generic [ref=f2e24]:
      - generic [ref=f2e25]:
        - paragraph [ref=f2e26]: "Business Support prints the pick labels for each delivery: the locations and piece quantities that VNA operators need to pick from the racks. A delivery can carry one or several pick labels."
        - paragraph [ref=f2e27]: Along with the pick labels, they place a magnetic card on the whiteboard with the delivery number and pick count. That card starts in the Allocated column.
        - paragraph [ref=f2e28]: "From there, every actor who completes their part of the process moves the card to the next column: Picking → Pick dropped → Packing → Strap and sealing → Pick up next day / Pick up today."
        - paragraph [ref=f2e29]: The Team Leader keeps the board under constant observation — it's the only real-time source of status that exists today.
      - generic [ref=f2e30]:
        - generic [ref=f2e31]: Physical whiteboard — 7 columns
        - generic [ref=f2e32]:
          - generic [ref=f2e36]: "80412771"
          - generic [ref=f2e37]: 8 pick labels · Allocated
        - generic [ref=f2e38]:
          - heading "What the board can't give you" [level=4] [ref=f2e39]
          - list [ref=f2e40]:
            - listitem [ref=f2e41]: — No one sees the status without standing in front of it
            - listitem [ref=f2e42]: — No record of who moved which card, or when
            - listitem [ref=f2e43]: — A stuck delivery doesn't raise a flag — someone has to notice it by eye
            - listitem [ref=f2e44]: — Each delivery's marker (cone/color) is decided separately, and never documented
